name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Build installers on main
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri -- build --bundles dmg
      - name: Build signed update on a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing a release.' >&2
            exit 1
          fi
          npm run tauri -- build --bundles dmg --config src-tauri/tauri.updater.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Vibe-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Build installers on main
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package:windows
      - name: Build signed update on a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing a release.'
          }
          npm run tauri -- build --bundles nsis,msi --config src-tauri/tauri.updater.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-Vibe-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: Pomodoro-Vibe-*
          path: release-input
          merge-multiple: true
      - name: Create and validate update manifest
        run: node scripts/prepare-release.mjs release-input release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Pomodoro Vibe $GITHUB_REF_NAME" \
            --generate-notes --verify-tag "${extra[@]}"
