  <style>
    #guitar_2_ { animation: guitar-hover 4s ease-in-out infinite; }
    #shadow { animation: shadow-breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    #speaker-1 { animation: speaker-beat 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .amply-speaker-outer { animation: speaker-breathe 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparks { opacity: 0; }
    .notes { animation: note-float 3s ease-in-out infinite; }
    #note-2_2_ { animation-delay: -.75s; }
    #note-3_2_ { animation-delay: -1.5s; }
    #note-4_2_ { animation-delay: -2.25s; }
    @keyframes guitar-hover { 50% { transform: translateY(12px); } }
    @keyframes shadow-breathe { 50% { transform: scaleX(1.06); } }
    @keyframes speaker-beat { 50% { transform: scale(1.08); } }
    @keyframes speaker-breathe { 50% { transform: scale(1.015); } }
    @keyframes note-float { 50% { transform: translateY(-12px); opacity: .72; } }
    @media (prefers-reduced-motion: reduce) {
      #guitar_2_, #shadow, #speaker-1, .amply-speaker-outer, .notes { animation: none; }
    }
